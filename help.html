<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">
    <title>Help — tw-web</title>
    <script>(function(){var t=localStorage.getItem('tw-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="styles.css">
    <script src="nav.js"></script>
    <script src="tw-api.js"></script>
    <script src="marked.min.js"></script>
    <script src="help.js"></script>
    <style>
        body { background: var(--bg); color: var(--text); }
        .help-wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; }
        .help-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 10px; flex-wrap: wrap; }
        .help-tab {
            background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted);
            padding: 8px 12px; font-size: 14px; cursor: pointer; margin-bottom: -1px;
        }
        .help-tab:hover { color: var(--text); }
        .help-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
        .help-head { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; line-height: 1.5; }
        .help-head a { color: var(--accent); }

        .help-list-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .help-filter {
            flex: 1; min-width: 0; padding: 6px 10px; font-size: 14px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg2); color: var(--text);
        }
        .help-mode { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
        .help-mode-btn { background: var(--bg2); color: var(--text-muted); border: none; padding: 6px 10px; font-size: 13px; cursor: pointer; }
        .help-mode-btn.active { background: var(--bg3); color: var(--text); font-weight: 600; }

        details.help-cat { border-bottom: 1px solid var(--border); }
        details.help-cat > summary { cursor: pointer; padding: 9px 2px; font-weight: 600; font-size: 14px; }
        .help-cat-count { color: var(--text-muted); font-weight: normal; margin-left: 6px; font-size: 12px; }
        .help-items, .help-az { list-style: none; margin: 0; padding: 0 0 8px; }
        .help-item { display: flex; gap: 10px; padding: 5px 2px 5px 18px; font-size: 14px; line-height: 1.4; }
        .help-az .help-item { padding-left: 2px; }
        .help-item-cat { flex: 0 0 150px; color: var(--text-muted); font-size: 12px; padding-top: 2px; }
        .help-item-main { display: flex; flex-wrap: wrap; column-gap: 8px; min-width: 0; }
        .help-item-link { color: var(--accent); text-decoration: none; }
        .help-item-link:hover { text-decoration: underline; }
        .help-item-nolink { font-family: monospace; }
        .help-item-summary { color: var(--text-muted); font-size: 13px; }
        .help-none, .help-loading, .help-error { color: var(--text-muted); font-size: 14px; }
        .help-error { color: var(--red); }

        .help-back { display: inline-block; margin-bottom: 8px; color: var(--accent); text-decoration: none; font-size: 13px; }
        .help-md { font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
        .help-md h1 { font-size: 1.4rem; margin: 6px 0 12px; }
        .help-md h2 { font-size: 1.1rem; margin: 22px 0 8px; }
        .help-md h3 { font-size: 1rem; margin: 18px 0 6px; }
        .help-md a { color: var(--accent); }
        .help-md a.help-image { color: var(--text-muted); font-style: italic; }
        .help-md code { font-size: 0.92em; background: var(--bg3); padding: 1px 4px; border-radius: 3px; }
        .help-md pre { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
        .help-md pre code { background: none; padding: 0; }
        .help-md table { border-collapse: collapse; margin: 8px 0; display: block; overflow-x: auto; }
        .help-md th, .help-md td { border-bottom: 1px solid var(--border); padding: 5px 10px 5px 2px; text-align: left; vertical-align: top; }
        .help-md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--text-muted); }

        @media (max-width: 768px) {   /* bp: phone */
            .help-az .help-item { flex-direction: column; gap: 0; }
            .help-item-cat { flex: none; padding-top: 0; }
        }
    </style>
</head>
<body>

<div class="help-wrap">
    <div id="help-tabs" class="help-tabs" role="tablist"></div>
    <p id="help-head" class="help-head"></p>
    <div id="help-lists"></div>
    <div id="help-page"></div>
</div>

</body>
</html>
